[build]
  command = "node scripts/build-data.js && node scripts/build-testimonials.js && mkdir -p public/data && cp data/properties.json public/data/properties.json && cp data/testimonials.json public/data/testimonials.json && node scripts/build-sitemap.js && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirection pour /admin/ (Decap CMS)
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Redirection pour les assets d'upload
[[redirects]]
  from = "/uploads/*"
  to = "/uploads/:splat"
  status = 200

# SPA redirect for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
