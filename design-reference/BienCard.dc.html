<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="./image-slot.js"></script>
</helmet>

<article style="background:#FFFFFF;border:1px solid #ECECEC;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;height:100%;font-family:'IBM Plex Sans',system-ui,sans-serif;transition:box-shadow .3s ease,transform .3s ease" style-hover="box-shadow:0 20px 46px rgba(6,38,79,.14);transform:translateY(-5px)">
  <div style="position:relative;height:214px;overflow:hidden;background:#F5F5F5">
    <image-slot id="card-{{ bien.id }}" style="position:absolute;inset:0;width:100%;height:100%" shape="rect" src="{{ bien.photo }}" credit="{{ bien.credit }}" credit-href="{{ bien.creditHref }}" placeholder="Photo du bien"></image-slot>
    <span style="position:absolute;top:14px;left:14px;background:{{ bien.rubanBg }};color:#FFFFFF;font-family:Manrope,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;padding:7px 13px;border-radius:6px">{{ bien.ruban }}</span>
  </div>
  <div style="padding:20px;display:flex;flex-direction:column;flex:1;gap:12px">
    <span style="display:flex;align-items:center;gap:7px;color:#0A4D9B;font-size:13.5px;font-weight:600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>{{ bien.zone }}</span>
    <h3 style="font-family:Manrope,sans-serif;font-weight:700;font-size:19px;line-height:1.3;margin:0;color:#222222">{{ bien.titre }}</h3>
    <p style="margin:0;color:#6A7480;font-size:13.5px">{{ bien.detail }}</p>
    <div style="margin-top:auto;padding-top:12px;border-top:1px solid #F1F2F4">
      <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:23px;color:#0A4D9B;letter-spacing:-.01em">{{ bien.prixLabel }}</div>
      <div style="color:#6A7480;font-size:13px;margin-top:3px">{{ bien.prixM2Label }}</div>
    </div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <a href="Fiche-bien.dc.html" style="flex:1;text-align:center;background:#0A4D9B;color:#FFFFFF;font-family:Manrope,sans-serif;font-weight:700;font-size:14px;padding:12px;border-radius:10px;text-decoration:none" style-hover="background:#F57C00">Voir le détail</a>
      <a href="https://wa.me/221770000000" aria-label="Contacter par WhatsApp" style="width:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px solid #DCE3EC;border-radius:10px;color:#0A4D9B" style-hover="background:#25D366;border-color:#25D366;color:#FFFFFF"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.7 14.9L2 22l5.2-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .1-1.7-.1a11 11 0 0 1-4-2.4 10 10 0 0 1-2-3c-.2-.6-.3-1.3 0-1.8.2-.4.6-.8 1-1 .3-.1.7 0 .9.3l.8 1.4c.1.3 0 .5-.1.7l-.4.5c-.1.2-.2.4 0 .6.5.9 1.5 1.9 2.5 2.4.2.1.4 0 .6-.1l.6-.7c.2-.2.4-.2.6-.1l1.5.8c.2.1.3.4.3.6 0 .1 0 .2-.1.3Z"/></svg></a>
    </div>
  </div>
</article>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 340, &quot;height&quot;: 520 },
  &quot;bien&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;Bien&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const b = this.props.bien || {};
    const bien = Object.assign({ id: "x", ruban: "Bien", zone: "Sénégal", titre: "Bien immobilier", detail: "", prixLabel: "", prixM2Label: "", photo: "", credit: "", creditHref: "" }, b);
    bien.rubanBg = bien.rubanTon === "orange" ? "#F57C00" : "#0A4D9B";
    return { bien };
  }
}
</script>
</body>
</html>
