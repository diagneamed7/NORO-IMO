backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

locale: "fr"

collections:
  - name: "biens"
    label: "Biens immobiliers"
    label_singular: "Bien"
    folder: "content/biens"
    create: true
    delete: true
    slug: "{{fields.zone}}-{{fields.type}}"
    summary: "{{type}} - {{zone}} ({{prix}} FCFA) - {{statut}}"
    fields:
      - { label: "Titre de l'annonce", name: "titre_annonce", widget: "string" }
      - label: "Type de bien"
        name: "type"
        widget: "select"
        options: ["Terrain", "Maison", "Villa", "Appartement", "Bureau", "Immeuble", "Local commercial"]
      - { label: "Zone / Localisation", name: "zone", widget: "string" }
      - { label: "Superficie (m2)", name: "superficie", widget: "number", required: false }
      - { label: "Prix (FCFA)", name: "prix", widget: "number", required: false }
      - { label: "Titre foncier", name: "titre_foncier", widget: "string" }
      - label: "Statut"
        name: "statut"
        widget: "select"
        options:
          - { label: "Disponible", value: "disponible" }
          - { label: "Réservé", value: "reserve" }
          - { label: "Vendu", value: "vendu" }
        default: "disponible"
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Photo du bien", name: "photo", widget: "image", required: false }
      - { label: "Moratoire disponible ?", name: "moratoire_disponible", widget: "boolean", default: false }
      - { label: "Prix moratoire (FCFA)", name: "moratoire_prix", widget: "number", required: false }
      - { label: "Acompte (FCFA)", name: "moratoire_acompte", widget: "number", required: false }
      - { label: "Mensualité (FCFA)", name: "moratoire_mensualite", widget: "number", required: false }
      - { label: "Durée (mois)", name: "moratoire_duree", widget: "number", required: false }
